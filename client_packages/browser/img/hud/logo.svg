<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Biohazard logo">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4a4a"/>
      <stop offset="100%" stop-color="#b10000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="none"/>
  <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle"
        font-size="360" font-family="'Segoe UI Symbol','Noto Sans Symbols2','DejaVu Sans',sans-serif"
        fill="url(#redGrad)" filter="url(#shadow)">☣</text>
</svg>
