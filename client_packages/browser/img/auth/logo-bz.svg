<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Black Zone RP logo">
  <defs>
    <linearGradient id="zoneRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <text x="50%" y="100" text-anchor="middle" dominant-baseline="middle"
        font-size="125" font-family="'Segoe UI Symbol','Noto Sans Symbols2','DejaVu Sans',sans-serif"
        fill="url(#zoneRed)" filter="url(#shadow)">☣</text>

  <text x="460" y="232" text-anchor="end" font-size="108" font-weight="900"
        font-family="'Arial Black','Impact',sans-serif"
        fill="#efefef" stroke="#101010" stroke-width="3" paint-order="stroke" filter="url(#shadow)">BLACK</text>
  <text x="475" y="232" text-anchor="start" font-size="108" font-weight="900"
        font-family="'Arial Black','Impact',sans-serif"
        fill="url(#zoneRed)" stroke="#2a0000" stroke-width="3" paint-order="stroke" filter="url(#shadow)">ZONE</text>

  <line x1="250" y1="268" x2="420" y2="268" stroke="#b00000" stroke-width="5" stroke-linecap="round"/>
  <line x1="560" y1="268" x2="730" y2="268" stroke="#b00000" stroke-width="5" stroke-linecap="round"/>

  <text x="50%" y="324" text-anchor="middle" font-size="84" font-weight="900"
        font-family="'Arial Black','Impact',sans-serif"
        fill="#efefef" stroke="#101010" stroke-width="3" paint-order="stroke" filter="url(#shadow)">RP</text>
</svg>
