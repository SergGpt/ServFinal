<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Black Zone RP">
  <defs>
    <linearGradient id="bioRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#a70000"/>
    </linearGradient>
    <linearGradient id="zoneRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="100%" stop-color="#b00000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <text x="50%" y="102" text-anchor="middle" dominant-baseline="middle"
        font-size="125" font-family="'Segoe UI Symbol','Noto Sans Symbols2','DejaVu Sans',sans-serif"
        fill="url(#bioRed)" filter="url(#shadow)">☣</text>

  <text x="460" y="232" text-anchor="end"
        font-size="108" font-weight="900" letter-spacing="1"
        font-family="'Arial Black','Impact',sans-serif"
        fill="#efefef" stroke="#161616" stroke-width="3" paint-order="stroke" filter="url(#shadow)">BLACK</text>

  <text x="475" y="232" text-anchor="start"
        font-size="108" font-weight="900" letter-spacing="1"
        font-family="'Arial Black','Impact',sans-serif"
        fill="url(#zoneRed)" stroke="#240000" stroke-width="3" paint-order="stroke" filter="url(#shadow)">ZONE</text>

  <line x1="250" y1="268" x2="420" y2="268" stroke="#b00000" stroke-width="5" stroke-linecap="round"/>
  <line x1="560" y1="268" x2="730" y2="268" stroke="#b00000" stroke-width="5" stroke-linecap="round"/>

  <text x="50%" y="325" text-anchor="middle"
        font-size="86" font-weight="900"
        font-family="'Arial Black','Impact',sans-serif"
        fill="#efefef" stroke="#161616" stroke-width="3" paint-order="stroke" filter="url(#shadow)">RP</text>
</svg>
