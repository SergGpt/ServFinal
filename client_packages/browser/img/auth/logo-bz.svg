<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Black Zone RP">
  <defs>
    <linearGradient id="bioRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#a70000"/>
    </linearGradient>
    <linearGradient id="zoneRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="100%" stop-color="#b00000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <text x="50%" y="112" text-anchor="middle" dominant-baseline="middle"
        font-size="150" font-family="'Segoe UI Symbol','Noto Sans Symbols2','DejaVu Sans',sans-serif"
        fill="url(#bioRed)" filter="url(#shadow)">☣</text>

  <text x="405" y="238" text-anchor="end"
        font-size="118" font-weight="900" letter-spacing="1"
        font-family="'Arial Black','Impact',sans-serif"
        fill="#efefef" stroke="#161616" stroke-width="4" paint-order="stroke" filter="url(#shadow)">BLACK</text>

  <text x="420" y="238" text-anchor="start"
        font-size="118" font-weight="900" letter-spacing="1"
        font-family="'Arial Black','Impact',sans-serif"
        fill="url(#zoneRed)" stroke="#240000" stroke-width="4" paint-order="stroke" filter="url(#shadow)">ZONE</text>

  <line x1="170" y1="272" x2="360" y2="272" stroke="#b00000" stroke-width="5" stroke-linecap="round"/>
  <line x1="540" y1="272" x2="730" y2="272" stroke="#b00000" stroke-width="5" stroke-linecap="round"/>

  <text x="50%" y="330" text-anchor="middle"
        font-size="92" font-weight="900"
        font-family="'Arial Black','Impact',sans-serif"
        fill="#efefef" stroke="#161616" stroke-width="4" paint-order="stroke" filter="url(#shadow)">RP</text>
</svg>
